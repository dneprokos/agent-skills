name: Skill Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/skills/**"
      - ".cursor/skills/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - ".github/agents/**"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - ".claude-plugin/**"
      - "plugins/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate changed skills
    runs-on: ubuntu-latest
    env:
      VALIDATION_REPORT: /tmp/validation-report.txt
      SLACK_PAYLOAD: /tmp/slack-payload.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed skills, agents, plugins and settings
        id: detect
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          CHANGED=$(git diff --name-only "$BASE"..."$HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          SKILL_DIRS=$(echo "$CHANGED" \
            | grep -E '^\.github/skills/[^/]+/' \
            | sed 's|^\(\.github/skills/[^/]*\)/.*|\1|' \
            | sort -u || true)

          AGENT_FILES=$(echo "$CHANGED" \
            | grep -E '^\.(claude|github)/agents/[^/]+\.md$' \
            | sort -u || true)

          PLUGIN_DIRS=$(echo "$CHANGED" \
            | grep -E '^plugins/[^/]+/' \
            | sed 's|^\(plugins/[^/]*\)/.*|\1|' || true)

          # A marketplace change can affect any plugin entry — recheck them all
          if echo "$CHANGED" | grep -q '^\.claude-plugin/'; then
            ALL_PLUGINS=$(ls -d plugins/*/ 2>/dev/null | sed 's|/$||' || true)
            PLUGIN_DIRS=$(printf '%s\n%s\n' "$PLUGIN_DIRS" "$ALL_PLUGINS")
          fi
          PLUGIN_DIRS=$(echo "$PLUGIN_DIRS" | sort -u)

          # Hooks are validated together with the settings file that wires them
          SETTINGS=""
          if echo "$CHANGED" | grep -qE '^\.claude/(settings\.json$|hooks/)'; then
            SETTINGS=".claude/settings.json"
          fi

          # Drop anything the PR deleted
          TARGETS=""
          for t in $SKILL_DIRS $AGENT_FILES $PLUGIN_DIRS $SETTINGS; do
            if [ -e "$t" ]; then
              TARGETS="$TARGETS $t"
            fi
          done
          TARGETS="${TARGETS# }"

          if [ -z "$TARGETS" ]; then
            echo "No skill, agent, plugin or settings changes detected — skipping validation."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Targets to validate: $TARGETS"
            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.detect.outputs.has_changes == 'true'
        run: pip install pyyaml

      # -----------------------------------------------------------------------
      # Run validator — always succeeds (informational only)
      # -----------------------------------------------------------------------
      - name: Run skill validator
        if: steps.detect.outputs.has_changes == 'true'
        id: validate
        env:
          PYTHONUTF8: "1"
        run: |
          TARGETS="${{ steps.detect.outputs.targets }}"
          OUTPUT=$(python .github/skills/skill-validator/scripts/validate_skill.py $TARGETS)
          echo "$OUTPUT"

          # Write full report to file (avoids multiline quoting issues in outputs)
          echo "$OUTPUT" > "$VALIDATION_REPORT"

          # Write to job summary
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

          # Parse machine-readable STAT line
          STAT=$(echo "$OUTPUT" | grep "^STAT:" | sed 's/STAT://')
          CHECKED=$(echo "$STAT" | grep -oP 'checked=\K[0-9]+' || echo "0")
          HIGH=$(echo    "$STAT" | grep -oP 'high=\K[0-9]+'    || echo "0")
          MEDIUM=$(echo  "$STAT" | grep -oP 'medium=\K[0-9]+'  || echo "0")
          LOW=$(echo     "$STAT" | grep -oP 'low=\K[0-9]+'     || echo "0")
          FINDINGS=$(echo "$OUTPUT" | grep "^FINDINGS:" | sed 's/FINDINGS://' || echo "")

          echo "checked=$CHECKED"   >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "low=$LOW"           >> "$GITHUB_OUTPUT"
          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # PR comment — create or update
      # -----------------------------------------------------------------------
      - name: Post results as PR comment
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.VALIDATION_REPORT, 'utf8');

            const body = [
              '## :shield: Skill Security Check',
              '',
              report,
              '',
              '_Powered by [skill-validator](.github/skills/skill-validator/SKILL.md)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Skill Security Check')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # -----------------------------------------------------------------------
      # Slack notification → #skills_repo
      # Requires secret: SLACK_SKILLS_WEBHOOK_URL (incoming webhook for #skills_repo)
      # -----------------------------------------------------------------------
      - name: Build Slack payload
        if: steps.detect.outputs.has_changes == 'true'
        env:
          PYTHONUTF8: "1"
          CHECKED:     ${{ steps.validate.outputs.checked }}
          HIGH:        ${{ steps.validate.outputs.high }}
          MEDIUM:      ${{ steps.validate.outputs.medium }}
          LOW:         ${{ steps.validate.outputs.low }}
          FINDINGS:    ${{ steps.validate.outputs.findings }}
          PR_NUM:      ${{ github.event.pull_request.number }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          BRANCH:      ${{ github.head_ref }}
          REPO:        ${{ github.repository }}
          OUTPUT_PATH: ${{ env.SLACK_PAYLOAD }}
        run: python .github/skills/skill-validator/scripts/build_slack_payload.py

      - name: Notify Slack — skills_repo
        if: steps.detect.outputs.has_changes == 'true'
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook:           ${{ secrets.SLACK_SKILLS_WEBHOOK_URL }}
          webhook-type:      incoming-webhook
          payload-file-path: ${{ env.SLACK_PAYLOAD }}

      - name: No validated changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "No skill, agent, plugin or settings changes in this PR — validation skipped."
