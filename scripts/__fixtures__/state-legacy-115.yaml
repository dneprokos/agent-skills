test_design:
  status: classified
  review_status: needs_revision
  last_findings_ids: [DESIGN-C1, DESIGN-M1, DESIGN-M4, DESIGN-M5, DESIGN-M6, DESIGN-m2, DESIGN-m3, DESIGN-m4, DESIGN-m5, DESIGN-m6]
  findings_resolved_ids: [DESIGN-M2, DESIGN-M3, DESIGN-m1]
  escalation_reason: >-
    max_review_iterations (2) reached with the verdict still Needs Revision. Root cause named by the
    reviewer: the scenario generator read its revision contract as append-only and treated every finding
    that required editing an existing line as unfixable, appending commentary instead. The Critical
    finding DESIGN-C1 therefore survived both iterations intact — SCN-011 still asserts
    "Expected: The Guest returns to a catalogue grid view" for browser Back, which no requirement states —
    and the appended SCN-017 now contradicts it (DESIGN-M5, one transition with two instructions).
  human_decision_required: >-
    Either (a) correct the append-only reading of docs/automation/revision-contract.md so a revision may
    edit the lines its findings name, then re-run design review; or (b) authorise a full regenerate of the
    test design; or (c) answer the underlying requirements gaps on SCRUM-901 ([REQ-C1] what proves the
    detail page rendered, [REQ-C2] the <id> format, [REQ-C3] the detail-page field list, plus the Back
    behaviour behind DESIGN-C1) so the design has stated values to assert. The orchestrator will not pass a
    regenerate token or approve an assumption on anyone's behalf.
  open_questions:
    - "[REQ-C1]/[REQ-C3] What proves 'the detail page renders'? No element, test hook or field list is stated."
    - "[REQ-C2] What is the format of <id> in /game/<id> — numeric, UUID or slug?"
    - "[REQ-M2]/[REQ-M4] What does a Guest see when the game behind the clicked card no longer exists?"
    - "[REQ-M5]/[REQ-M6] What happens on a malformed or over-long <id>? No validation rule stated."
    - "[REQ-M6]/[REQ-M9] What is the behaviour when the detail fetch fails (404/5xx) or times out? No endpoint contract stated."
    - "Is /game/<id> deep-linkable and public without a session?"
    - "[REQ-M7] Does an authenticated Admin/Owner see the same detail page as a Guest?"
    - "[REQ-M8] Must browser Back restore the catalogue pagination page?"
    - "[REQ-M1] Must keyboard activation (Enter/Space) on a focused card navigate?"
    - "[REQ-M8] Is there an upper bound on navigation/detail-load time?"
  last_findings: null
  unapproved_unknowns:
    - { scenario: SCN-001, missing: "render-proof hook / detail-page field list [REQ-C1,REQ-C3]" }
    - { scenario: SCN-002, missing: "id format [REQ-C2]" }
    - { scenario: SCN-003, missing: "stale-game outcome [REQ-M2,REQ-M4]" }
    - { scenario: SCN-004, missing: "malformed-id error behaviour [REQ-M5,REQ-M6]" }
    - { scenario: SCN-005, missing: "detail-fetch failure behaviour [REQ-M6,REQ-M9]" }
    - { scenario: SCN-006, missing: "timeout/retry behaviour [REQ-M9]" }
    - { scenario: SCN-007, missing: "id format and length limit [REQ-C2,REQ-M5]" }
    - { scenario: SCN-008, missing: "deep-link support [Open Questions]" }
    - { scenario: SCN-009, missing: "authenticated-role outcome [REQ-M7]" }
    - { scenario: SCN-010, missing: "authenticated + removed compound outcome [REQ-M2,REQ-M4,REQ-M7]" }
    - { scenario: SCN-013, missing: "detail-page card affordance [REQ-C3]" }
    - { scenario: SCN-014, missing: "keyboard-activation behaviour [REQ-M1]" }
    - { scenario: SCN-015, missing: "navigation/load-time bound [REQ-M8]" }
  blocked_scenarios: [SCN-003, SCN-004, SCN-005, SCN-006, SCN-007, SCN-008, SCN-009, SCN-010, SCN-013, SCN-014, SCN-015]
